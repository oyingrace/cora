name: Deploy web to Cloudflare Workers

on:
  push:
    branches:
      - main
    paths:
      - 'web/**'
      - '.github/workflows/deploy-web.yml'

jobs:
  deploy:
    name: Build & deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Build
        working-directory: web
        run: npm run build:vinext
        env:
          CORA_BACKEND_URL: https://cora-backend.fly.dev
          NEXT_PUBLIC_API_BASE: https://agent-cora.fs.kg
          NEXT_PUBLIC_DASHBOARD_URL: https://dashboard.agent-cora.fs.kg
          NEXT_PUBLIC_NETWORK: testnet
          NEXT_PUBLIC_STELLAR_NETWORK: testnet
          NEXT_PUBLIC_MOCK_VCC: "true"

      - name: Deploy
        working-directory: web
        # Pass --config explicitly so wrangler targets the generated config directly
        # instead of walking up to the npm workspace root and refusing to run.
        run: npx wrangler deploy --config dist/client/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: b6758eeaae01058e956f65069dfccf06
