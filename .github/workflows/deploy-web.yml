name: Deploy web to Cloudflare Workers

on:
  push:
    branches:
      - master
    paths:
      - 'web/**'
      - '.github/workflows/deploy-web.yml'

jobs:
  deploy:
    name: Build & deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies (root, installs all workspaces)
        run: npm ci

      - name: Build web only
        # Run from root but explicitly target web workspace to avoid npm workspace confusion
        run: npm run build:vinext -w web
        env:
          CORA_BACKEND_URL: https://cora-backend.fly.dev
          NEXT_PUBLIC_API_BASE: https://agent-cora.fs.kg
          NEXT_PUBLIC_DASHBOARD_URL: https://dashboard.agent-cora.fs.kg
          NEXT_PUBLIC_NETWORK: testnet
          NEXT_PUBLIC_STELLAR_NETWORK: testnet
          NEXT_PUBLIC_MOCK_VCC: "true"

      - name: Deploy
        # Run from root with explicit config path to avoid workspace root detection
        run: npx wrangler deploy --config web/dist/client/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: b6758eeaae01058e956f65069dfccf06
