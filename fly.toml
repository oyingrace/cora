# fly.toml — Cora backend on Fly.io
# Docker context is the monorepo root (one level up from this file)
# so the SDK's file:../sdk link resolves during npm ci.

app = "cora-backend"
primary_region = "lhr"

[build]
  dockerfile = "backend/Dockerfile"
  build_target = ""

[env]
  NODE_ENV    = "production"
  PORT        = "4200"
  DB_PATH     = "/data/cora.db"
  STELLAR_NETWORK = "testnet"

[http_service]
  internal_port       = 4200
  force_https         = true
  auto_stop_machines  = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes            = ["app"]

  [[http_service.checks]]
    grace_period = "10s"
    interval     = "30s"
    method       = "GET"
    path         = "/status"
    timeout      = "5s"

[[mounts]]
  source      = "cora_data"
  destination = "/data"

[[vm]]
  memory   = "1gb"
  cpu_kind = "shared"
  cpus     = 1
