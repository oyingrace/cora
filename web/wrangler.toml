# Root wrangler.toml — build-time config for Cloudflare Vite plugin.
# The actual deployed config is auto-generated at dist/client/wrangler.json
# during `vite build` and patched by scripts/patch-wrangler.mjs.
#
# DO NOT specify `main` here — it doesn't exist until after the build runs,
# and the Cloudflare Vite plugin validates it before building.

name = "cora"
compatibility_date = "2026-11-25"

[assets]
directory = "dist/client"
binding = "ASSETS"

[vars]
CORA_BACKEND_URL = "https://cora-backend.fly.dev"
NEXT_PUBLIC_API_BASE = "https://agent-cora.fs.kg"
NEXT_PUBLIC_DASHBOARD_URL = "https://dashboard.agent-cora.fs.kg"
NEXT_PUBLIC_NETWORK = "testnet"
NEXT_PUBLIC_MOCK_VCC = "true"
