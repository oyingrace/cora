# fly.toml app configuration file generated for cora-backend on 2026-11-26T13:28:32+01:00
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'cora-backend'
primary_region = 'lhr'

[build]
[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
